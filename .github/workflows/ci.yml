name: DevSecOps CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint Kubernetes YAML
        run: yamllint k8s/deployment.yaml

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.67.1
          curl -L "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" -o /tmp/conftest.tar.gz
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          sudo mv /tmp/conftest /usr/local/bin/conftest
          sudo chmod +x /usr/local/bin/conftest

      - name: Run Conftest policy checks
        run: conftest test k8s/deployment.yaml --policy policy

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy filesystem scan
        run: trivy fs --scanners vuln,secret,misconfig --exit-code 0 .

      - name: Build Docker image
        run: docker build -t devsecops-demo:ci .

      - name: Run Trivy image scan
        run: trivy image --scanners vuln,secret,misconfig --exit-code 0 devsecops-demo:ci
